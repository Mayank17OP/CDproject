name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html styles.css analyzer.js PRD.md README.md LICENSE _site/
          touch _site/.nojekyll

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          # Enables Pages automatically when the repository token allows it.
          # If it can't, enable once manually: Settings → Pages → Source: GitHub Actions
          enablement: true
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
